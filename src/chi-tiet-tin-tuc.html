  <script type="module">
    const articlesData = [
      {
        id: 1,
        title: "Bí quyết chọn thảm lót sàn ô tô phù hợp cho mùa mưa gió bão bùng",
        date: "15 Tháng 6, 2026",
        desc: "Mùa mưa bão sắp tới mang theo nỗi lo bùn đất bám vào nỉ sàn xe hơi gây nấm mốc, bốc mùi hôi thối khó chịu.",
        categoryLabel: "KINH NGHIỆM",
        image: "./assets/images/news-featured.webp",
        body: `<p>Mùa mưa tại Việt Nam khiến giày dép mang theo bùn đất làm ẩm sàn nỉ nguyên bản, dễ gây nấm mốc và mùi hôi khó chịu.</p><h2 class="text-base font-semibold text-[#0D2C54]">1. Thảm Nhựa TPE Đúc Khuôn</h2><p>Kỵ nước hoàn toàn, có mép viền dựng cao giữ nước và bùn đất không tràn xuống sàn nỉ.</p><h2 class="text-base font-semibold text-[#0D2C54]">2. Thảm Da 6D Kèm Thảm Rối</h2><p>Lớp rối phía trên giữ bụi bẩn và tháo rời giặt rửa dễ dàng, lớp da bên dưới giữ khoang xe luôn sạch sẽ sang trọng.</p>`
      },
      {
        id: 2,
        title: "Tại sao thảm lót sàn nhựa TPE lại trở thành xu hướng năm 2026?",
        date: "10 Tháng 6, 2026",
        desc: "Lý giải sức hút từ vật liệu nhựa TPE nguyên sinh đúc khuôn tràn viền: Độ bền vượt trội, không mùi, chống nước tuyệt đối.",
        categoryLabel: "XU HƯỚNG",
        image: "./assets/images/news-featured.webp",
        body: `<p>Nhựa TPE nguyên sinh an toàn cho sức khỏe, không sinh mùi hôi khi đỗ xe dưới trời nắng nóng và ôm khít sàn xe theo file quét Laser 3D.</p>`
      },
      {
        id: 3,
        title: "Sự khác biệt vượt trội giữa thảm da carbon và thảm da 6D truyền thống",
        date: "08 Tháng 6, 2026",
        desc: "So sánh chi tiết về tính thẩm mỹ, độ bền chỉ may và khả năng chống bám bụi của hai dòng thảm da bán chạy nhất.",
        categoryLabel: "KINH NGHIỆM",
        image: "./assets/images/news-featured.webp",
        body: `<p>Da vân Carbon mang phong cách thể thao hiện đại và dễ lau chùi; thảm 6D họa tiết quả trám mang lại cảm giác êm ái, ấm cúng cho khoang xe.</p>`
      },
      {
        id: 4,
        title: "Trung Thành Auto khai trương showroom trưng bày và dịch vụ lắp đặt mới tại Quận 7",
        date: "01 Tháng 6, 2026",
        desc: "Không gian showroom mới rộng rãi với đầy đủ bộ phom mẫu thảm thực tế giúp khách hàng dễ dàng sờ thử chất liệu.",
        categoryLabel: "SỰ KIỆN",
        image: "./assets/images/about-workshop.webp",
        body: `<p>Showroom mới tại Quận 7 trưng bày đầy đủ mẫu thảm 6D, 360 độ và nhựa TPE, hỗ trợ đo phom và lắp đặt trực tiếp cho khách hàng khu vực TP.HCM.</p>`
      },
      {
        id: 5,
        title: "Hướng dẫn tự vệ sinh thảm da 5D tại nhà cực nhanh trong 10 phút",
        date: "24 Tháng 5, 2026",
        desc: "Mẹo nhỏ sử dụng khăn ẩm vi sợi và dung dịch vệ sinh nội thất da chuyên dụng giúp làm sạch nhanh bụi đất.",
        categoryLabel: "KINH NGHIỆM",
        image: "./assets/images/news-featured.webp",
        body: `<p>Tháo lớp thảm rối để xịt rửa riêng, dùng máy hút bụi và khăn ẩm lau nhẹ bề mặt da rồi phơi nơi thoáng gió tự nhiên.</p>`
      },
      {
        id: 6,
        title: "Đánh giá của các chuyên gia ô tô về chất lượng thảm đúc khuôn TPE Trung Thành Auto",
        date: "15 Tháng 5, 2026",
        desc: "Các reviewer đánh giá cao độ ôm khít chân phanh, mép thành thảm dựng đứng giữ nước đổ nghiêng.",
        categoryLabel: "XU HƯỚNG",
        image: "./assets/images/news-featured.webp",
        body: `<p>Thảm TPE có chốt khóa cố định khớp sàn xe, loại bỏ nguy cơ kẹt chân ga phanh và dễ vệ sinh hàng ngày.</p>`
      },
      {
        id: 7,
        title: "Cách bảo quản thảm lót sàn da luôn bền đẹp sáng bóng như ngày đầu",
        date: "05 Tháng 5, 2026",
        desc: "Tránh phơi thảm trực tiếp dưới trời nắng gắt nhiệt độ cao, hạn chế giặt ngâm nước toàn bộ thảm da.",
        categoryLabel: "KINH NGHIỆM",
        image: "./assets/images/news-featured.webp",
        body: `<p>Không ngâm toàn bộ thảm da trong nước và không phơi dưới nắng gắt để giữ bề mặt da luôn mềm mịn, bền màu trên 5 năm.</p>`
      }
    ];

    const toSlug = (str) => str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[đĐ]/g, 'd').replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-').replace(/-+/g, '-');
    articlesData.forEach((a) => { a.slug = toSlug(a.title); });

    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      let article = null;

      if (window.ACTIVE_ARTICLE_ID) {
        article = articlesData.find((a) => a.id === window.ACTIVE_ARTICLE_ID);
      } else {
        const slugMatch = window.location.pathname.match(/\/tin-tuc\/([^/]+)\.html/);
        if (slugMatch) article = articlesData.find((a) => a.slug === slugMatch[1]);
      }

      if (!article) {
        const idParam = parseInt(params.get('id'), 10);
        if (idParam) article = articlesData.find((a) => a.id === idParam);
      }
      if (!article) article = articlesData[0];

      document.getElementById('page-title').textContent = `${article.title} - Trung Thành Auto`;
      document.getElementById('breadcrumb-title').textContent = article.title;
      document.getElementById('article-category').textContent = article.categoryLabel;
      document.getElementById('article-date').textContent = article.date;
      document.getElementById('article-title').textContent = article.title;
      document.getElementById('article-summary').textContent = article.desc;

      const heroImg = document.getElementById('article-hero-image');
      heroImg.src = article.image.startsWith('./') ? article.image.substring(1) : article.image;
      heroImg.alt = article.title;
      document.getElementById('article-body-content').innerHTML = article.body;

      const related = articlesData.filter((a) => a.id !== article.id).slice(0, 2);
      document.getElementById('related-articles-container').innerHTML = related.map((a) => `
        <a href="/tin-tuc/${a.slug}.html" class="border border-slate-200 rounded-xl p-3.5 bg-[#F4F6F9] hover:border-[#0D2C54] transition no-underline block">
          <span class="text-[10px] font-semibold text-[#C81E2B] uppercase">${a.categoryLabel}</span>
          <h4 class="text-xs font-semibold text-[#0D2C54] mt-1 mb-0 leading-snug line-clamp-2">${a.title}</h4>
        </a>
      `).join('');
    });
  </script>
</body>
