<!-- Cart Drawer Overlay -->
<div id="cart-drawer-overlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-[2px] z-50 hidden transition-opacity duration-300"></div>

<!-- Cart Drawer Panel -->
<aside id="cart-drawer" aria-label="Giỏ hàng" class="fixed top-0 right-0 bottom-0 w-full sm:w-[400px] bg-white border-l border-slate-200 z-50 translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
  <!-- Drawer Header -->
  <div class="px-5 py-3.5 bg-[#0D2C54] text-white flex items-center justify-between">
    <div class="flex items-center gap-2">
      <i data-lucide="shopping-bag" class="w-5 h-5"></i>
      <h3 class="font-semibold text-base m-0">Giỏ hàng của bạn</h3>
    </div>
    <button type="button" id="cart-drawer-close" class="icon-touch-btn text-slate-200 hover:text-white rounded-lg hover:bg-white/10 transition" aria-label="Đóng giỏ hàng">
      <i data-lucide="x" class="w-5 h-5"></i>
    </button>
  </div>

  <!-- Drawer Body -->
  <div class="flex-1 overflow-y-auto p-4 bg-[#F4F6F9]">
    <!-- Empty State -->
    <div id="cart-drawer-empty" class="h-full flex flex-col items-center justify-center text-center gap-4 py-12 hidden">
      <div class="w-16 h-16 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-400">
        <i data-lucide="shopping-cart" class="w-7 h-7"></i>
      </div>
      <div>
        <h4 class="font-semibold text-slate-900 text-sm">Giỏ hàng đang trống</h4>
        <p class="text-xs text-slate-500 mt-1 max-w-[220px] mx-auto">Chọn hãng và dòng xe để tìm bộ thảm lót sàn vừa vặn nhất.</p>
      </div>
      <a href="/san-pham.html" class="btn-cta text-xs px-6">CHỌN DÒNG XE NGAY</a>
    </div>

    <!-- Filled Items -->
    <div id="cart-drawer-items" class="space-y-3"></div>
  </div>

  <!-- Drawer Footer -->
  <div id="cart-drawer-filled" class="p-4 border-t border-slate-200 bg-white flex flex-col gap-3 hidden">
    <div class="flex items-center justify-between">
      <span class="text-sm font-medium text-slate-600">Tạm tính:</span>
      <span id="cart-drawer-total" class="font-bold text-lg text-[#15803D] tabular-nums">0 đ</span>
    </div>

    <div class="grid grid-cols-2 gap-2.5">
      <a href="/gio-hang.html" class="btn-outline text-xs">XEM GIỎ HÀNG</a>
      <a href="/thanh-toan.html" class="btn-cta text-xs">THANH TOÁN</a>
    </div>
    <p class="text-[11px] text-slate-500 text-center m-0">Vừa vặn 100% | Lắp tại nhà | Đổi trả 1-1</p>
  </div>
</aside>
