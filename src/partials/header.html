<header id="main-header" class="site-header">
  <a class="skip-to-content" href="#main-content">Bỏ qua điều hướng</a>

  <!-- MOBILE HOME HEADER (< 1024px, Trang chủ) -->
  <div class="mobile-header-home items-center justify-between gap-2.5 px-3 py-2 lg:hidden">
    <a href="/index.html" class="shrink-0 flex items-center gap-2 min-h-[44px] no-underline" aria-label="Trung Thành Auto - Trang chủ">
      <svg class="w-8 h-8 shrink-0" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="36" height="36" rx="8" fill="#C81E2B"/>
        <path d="M8 12.5C8 11.1193 9.11929 10 10.5 10H25.5C26.8807 10 28 11.1193 28 12.5V22L23.5 26.5H12.5L8 22V12.5Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
        <path d="M13 15.5H23M18 15.5V22" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <div class="leading-none hidden xs:block sm:block">
        <span class="block text-xs font-extrabold tracking-tight text-white">TRUNG THÀNH</span>
        <span class="block text-[9px] font-semibold tracking-widest text-slate-300 mt-0.5">THẢM LÓT SÀN</span>
      </div>
    </a>

    <form action="/san-pham.html" method="GET" class="flex-1 min-w-0">
      <label for="mobile-header-search" class="sr-only">Tìm theo tên xe</label>
      <div class="relative">
        <input id="mobile-header-search" type="search" name="q" placeholder="Tìm theo tên xe..."
          class="w-full h-10 bg-white border border-transparent rounded-lg pl-3 pr-9 text-xs text-slate-900 placeholder-slate-400 focus:outline-none">
        <button type="submit" class="absolute right-0 top-0 h-10 w-9 flex items-center justify-center text-slate-500 hover:text-[#0D2C54]" aria-label="Tìm kiếm">
          <i data-lucide="search" class="w-4 h-4"></i>
        </button>
      </div>
    </form>

    <button type="button" class="btn-open-cart icon-touch-btn relative text-white rounded-lg hover:bg-white/10 transition shrink-0" aria-label="Giỏ hàng">
      <i data-lucide="shopping-bag" class="w-5 h-5"></i>
      <span class="cart-count-badge absolute top-1.5 right-1.5 bg-[#C81E2B] text-white text-[10px] font-bold rounded-full min-w-[18px] h-[18px] px-1 flex items-center justify-center border border-[#0D2C54] tabular-nums hidden">0</span>
    </button>
  </div>

  <!-- MOBILE SUBPAGE APP BAR (< 1024px, Trang con) -->
  <div class="mobile-header-subpage items-center justify-between gap-2 px-2 py-1.5 lg:hidden">
    <button type="button" id="mobile-appbar-back" class="icon-touch-btn text-white rounded-lg hover:bg-white/10 transition shrink-0" aria-label="Quay lại">
      <i data-lucide="arrow-left" class="w-5 h-5"></i>
    </button>

    <span id="mobile-appbar-title" class="flex-1 text-center text-sm font-extrabold uppercase tracking-wide text-white truncate px-2">
      SẢN PHẨM
    </span>

    <button type="button" class="btn-open-cart icon-touch-btn relative text-white rounded-lg hover:bg-white/10 transition shrink-0" aria-label="Giỏ hàng">
      <i data-lucide="shopping-bag" class="w-5 h-5"></i>
      <span class="cart-count-badge absolute top-1.5 right-1.5 bg-[#C81E2B] text-white text-[10px] font-bold rounded-full min-w-[18px] h-[18px] px-1 flex items-center justify-center border border-[#0D2C54] tabular-nums hidden">0</span>
    </button>
  </div>

  <!-- DESKTOP HEADER (>= 1024px) -->
  <div class="hidden lg:block border-b border-white/10">
    <div class="container-app flex items-center justify-between gap-6 h-[68px]">
      <!-- Brand SVG Logo -->
      <a href="/index.html" class="flex items-center gap-2.5 shrink-0 no-underline group" aria-label="Trung Thành Auto - Trang chủ">
        <svg class="w-9 h-9 shrink-0 transition-transform duration-200 group-hover:scale-105" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="36" height="36" rx="8" fill="#C81E2B"/>
          <path d="M8 12.5C8 11.1193 9.11929 10 10.5 10H25.5C26.8807 10 28 11.1193 28 12.5V22L23.5 26.5H12.5L8 22V12.5Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
          <path d="M13 15.5H23M18 15.5V22" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <div class="leading-none">
          <span class="block text-[15px] font-extrabold tracking-tight text-white mb-1">TRUNG THÀNH AUTO</span>
          <span class="block text-[10px] font-semibold text-slate-300 mt-0.5">Thảm lót sàn ô tô</span>
        </div>
      </a>

      <!-- Minimal Navigation -->
      <nav aria-label="Điều hướng chính" class="flex items-center gap-1">
        <a href="/index.html" class="nav-link px-3.5 py-2 rounded-lg text-sm font-semibold text-slate-200 hover:text-white hover:bg-white/10 transition no-underline uppercase">Trang chủ</a>
        <a href="/san-pham.html" class="nav-link px-3.5 py-2 rounded-lg text-sm font-semibold text-slate-200 hover:text-white hover:bg-white/10 transition no-underline uppercase">Sản phẩm</a>
        <a href="/tin-tuc.html" class="nav-link px-3.5 py-2 rounded-lg text-sm font-semibold text-slate-200 hover:text-white hover:bg-white/10 transition no-underline uppercase">Tin tức</a>
        <a href="/lien-he.html" class="nav-link px-3.5 py-2 rounded-lg text-sm font-semibold text-slate-200 hover:text-white hover:bg-white/10 transition no-underline uppercase">Liên hệ</a>
      </nav>

      <!-- Search + Cart -->
      <div class="flex items-center gap-2.5">
        <form action="/san-pham.html" method="GET" class="relative">
          <label for="desktop-header-search" class="sr-only">Tìm theo tên xe</label>
          <input id="desktop-header-search" type="search" name="q" placeholder="Tìm theo tên xe..."
            class="w-60 h-10 bg-white border border-transparent rounded-lg pl-3.5 pr-9 text-xs font-medium text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-white/40 transition">
          <button type="submit" class="absolute right-0 top-0 h-10 w-9 flex items-center justify-center text-slate-500 hover:text-[#0D2C54]" aria-label="Tìm kiếm">
            <i data-lucide="search" class="w-4 h-4"></i>
          </button>
        </form>

        <button type="button" class="btn-open-cart relative inline-flex items-center gap-2 bg-[#C81E2B] hover:bg-[#A81622] text-white px-4 h-10 rounded-lg text-xs font-bold transition shrink-0 shadow-sm cursor-pointer" aria-label="Giỏ hàng">
          <i data-lucide="shopping-bag" class="w-4 h-4"></i>
          <span>Giỏ hàng</span>
          <span class="cart-count-badge bg-white text-[#C81E2B] text-[10px] font-extrabold rounded-full min-w-[18px] h-[18px] px-1 flex items-center justify-center tabular-nums hidden">0</span>
        </button>
      </div>
    </div>
  </div>
</header>
