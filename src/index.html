      <button type="button" id="lightbox-close" class="icon-touch-btn absolute top-2 right-2 bg-white/90 text-slate-900 rounded-full shadow hover:bg-white transition" aria-label="Đóng ảnh">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <img id="lightbox-img" src="" alt="" width="800" height="600" class="w-full max-h-[75vh] object-contain bg-slate-100">

  <script type="module" src="./assets/js/main.js"></script>
  <script type="module">
    import { VehicleSelector } from './assets/js/selector.js';
    import { Cart } from './assets/js/cart.js';

    document.addEventListener('DOMContentLoaded', () => {
      // 1. YMM Filter Dropdowns
      const brandSelect = document.getElementById('ymm-brand');
      const modelSelect = document.getElementById('ymm-model');
      const yearSelect = document.getElementById('ymm-year');
      const submitBtn = document.getElementById('ymm-submit-btn');
      const ymmForm = document.getElementById('ymm-filter-form');

      const brands = VehicleSelector.getBrands();
      brands.forEach((b) => {
        const opt = document.createElement('option');
        opt.value = b;
        opt.textContent = b;
        brandSelect.appendChild(opt);
      });

      const updateSubmitState = () => {
        submitBtn.disabled = !(brandSelect.value && modelSelect.value && yearSelect.value);
      };

      brandSelect.addEventListener('change', () => {
        const brand = brandSelect.value;
        modelSelect.innerHTML = '<option value="">Chọn Dòng Xe</option>';
        yearSelect.innerHTML = '<option value="">Chọn Năm Sản Xuất</option>';
        modelSelect.disabled = !brand;
        yearSelect.disabled = true;

        if (brand) {
          VehicleSelector.getModels(brand).forEach((m) => {
            const opt = document.createElement('option');
            opt.value = m;
            opt.textContent = m;
            modelSelect.appendChild(opt);
          });
        }
        updateSubmitState();
      });

      modelSelect.addEventListener('change', () => {
        const brand = brandSelect.value;
        const model = modelSelect.value;
        yearSelect.innerHTML = '<option value="">Chọn Năm Sản Xuất</option>';
        yearSelect.disabled = !(brand && model);

        if (brand && model) {
          VehicleSelector.getYears(brand, model).forEach((y) => {
            const opt = document.createElement('option');
            opt.value = y;
            opt.textContent = y;
            yearSelect.appendChild(opt);
          });
        }
        updateSubmitState();
      });

      yearSelect.addEventListener('change', updateSubmitState);

      // Restore previously selected vehicle if available
      const prevVehicle = VehicleSelector.getSelectedVehicle();
      if (prevVehicle && prevVehicle.brand && brands.includes(prevVehicle.brand)) {
        brandSelect.value = prevVehicle.brand;
        brandSelect.dispatchEvent(new Event('change'));
        if (prevVehicle.model && VehicleSelector.getModels(prevVehicle.brand).includes(prevVehicle.model)) {
          modelSelect.value = prevVehicle.model;
          modelSelect.dispatchEvent(new Event('change'));
          if (prevVehicle.year && VehicleSelector.getYears(prevVehicle.brand, prevVehicle.model).includes(prevVehicle.year)) {
            yearSelect.value = prevVehicle.year;
          }
        }
        updateSubmitState();
      }

      ymmForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const brand = brandSelect.value;
        const model = modelSelect.value;
        const year = yearSelect.value;
        if (!brand || !model || !year) return;

        VehicleSelector.setSelectedVehicle(brand, model, year);
        const hangSlug = VehicleSelector.toSlug(brand);
        const xeSlug = VehicleSelector.toSlug(model);
        window.location.href = `/chi-tiet.html?hang=${hangSlug}&xe=${xeSlug}&nam=${encodeURIComponent(year)}`;
      });

      // 2. Render Popular Car Brands
      const brandsContainer = document.getElementById('home-brands-list');
      const savedVehicle = VehicleSelector.getSelectedVehicle();
      const catalog = VehicleSelector.getBrandCatalog();

      brandsContainer.innerHTML = catalog.map((b, idx) => {
        const isActive = savedVehicle ? savedVehicle.brand === b.name : idx === 0;
        return `
          <a href="/san-pham.html?hang=${b.slug}" class="brand-circle-card ${isActive ? 'is-active' : ''}">
            <div class="brand-circle-badge p-2.5">
              <img src="${b.logo}" alt="Logo ${b.name}" width="40" height="40" class="w-full h-full object-contain">
            </div>
            <span class="brand-circle-name text-xs font-bold text-[#0D2C54] text-center leading-tight">${b.name}</span>
            <span class="hidden lg:block text-[11px] font-medium text-slate-500 tabular-nums">${b.models.length} dòng xe</span>
          </a>
        `;
      }).join('');

      // 3. Render Best Sellers
      const bestSellers = [
        { id: 4, name: 'Thảm 6D Cao Cấp', price: 1500000, image: '/assets/images/mat-6d-red.png', href: '/chi-tiet.html?id=4' },
        { id: 12, name: 'Thảm 360 Full Xe', price: 2200000, image: '/assets/images/mat-carbon-gold.png', href: '/chi-tiet.html?id=12' },
        { id: 2, name: 'Thảm Nhựa TPE Đúc Khuôn', price: 1890000, image: '/assets/images/mat-tpe-black.png', href: '/chi-tiet.html?id=2' },
        { id: 3, name: 'Thảm Da 5D Quả Trám', price: 1250000, image: '/assets/images/mat-5d-brown.png', href: '/chi-tiet.html?id=3' }
      ];

      const bestContainer = document.getElementById('home-bestseller-list');
      bestContainer.innerHTML = bestSellers.map((p) => `
        <a href="${p.href}" class="card-surface overflow-hidden flex flex-col min-w-[215px] snap-start lg:min-w-0 hover:border-[#0D2C54] transition group no-underline">
          <div class="aspect-[4/3] overflow-hidden bg-slate-100">
            <img src="${p.image}" alt="${p.name}" width="320" height="240" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
          </div>
          <div class="p-3.5 flex-1 flex flex-col justify-between gap-2">
            <div>
              <div class="star-rating text-xs mb-1" aria-label="Đánh giá 5 sao">
                <i data-lucide="star" class="w-3.5 h-3.5 fill-current"></i>
                <i data-lucide="star" class="w-3.5 h-3.5 fill-current"></i>
                <i data-lucide="star" class="w-3.5 h-3.5 fill-current"></i>
                <i data-lucide="star" class="w-3.5 h-3.5 fill-current"></i>
                <i data-lucide="star" class="w-3.5 h-3.5 fill-current"></i>
              </div>
              <h3 class="text-sm font-bold text-slate-900 m-0 leading-snug group-hover:text-[#0D2C54]">${p.name}</h3>
            </div>
            <p class="text-sm font-extrabold text-[#C81E2B] m-0 tabular-nums">${Cart.formatCurrency(p.price)}</p>
          </div>
        </a>
      `).join('');

      // 4. Lightbox for Real Installs
      const lightbox = document.getElementById('install-lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      const lightboxCaption = document.getElementById('lightbox-caption');
      const lightboxClose = document.getElementById('lightbox-close');

      const closeLightbox = () => {
        lightbox.classList.add('hidden');
        lightbox.classList.remove('flex');
      };

      document.querySelectorAll('.js-lightbox-trigger').forEach((btn) => {
        btn.addEventListener('click', () => {
          lightboxImg.src = btn.dataset.src;
          lightboxImg.alt = btn.dataset.caption;
          lightboxCaption.textContent = btn.dataset.caption;
          lightbox.classList.remove('hidden');
          lightbox.classList.add('flex');
        });
      });

      lightboxClose.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !lightbox.classList.contains('hidden')) closeLightbox();
      });

      if (window.lucide) window.lucide.createIcons();
    });
  </script>
