<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tin Tức &amp; Kinh Nghiệm | Trung Thành Auto</title>
  <meta name="description" content="Kinh nghiệm chọn thảm lót sàn ô tô 6D, 360 độ, nhựa TPE đúc khuôn và hướng dẫn vệ sinh bảo quản thảm xe hơi.">
  <link rel="canonical" href="https://thamoto.vercel.app/tin-tuc.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" type="image/png" href="/favicon.png" />

  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/assets/css/index.css">
</head>
<body class="bg-[#F4F6F9] text-[#0F172A]" data-subpage="true" data-page-title="TIN TỨC">

  <include src="partials/header.html"></include>

  <main id="main-content" class="container-app py-5 md:py-8 space-y-6">
    <nav aria-label="Breadcrumb" class="breadcrumb hidden lg:flex">
      <a href="/index.html">Trang chủ</a>
      <span>&gt;</span>
      <span class="font-semibold text-[#0D2C54]">Tin tức</span>
    </nav>

    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
      <h1 class="section-heading">TIN TỨC &amp; KINH NGHIỆM CHỌN THẢM</h1>
      <div class="relative w-full md:w-72">
        <label for="news-search" class="sr-only">Tìm kiếm bài viết</label>
        <input type="search" id="news-search" placeholder="Tìm kiếm bài viết..." class="field-input pr-10">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute right-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
      </div>
    </div>

    <!-- Category Tabs -->
    <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
      <button type="button" class="news-tab-btn shrink-0 min-h-[44px] px-4 rounded-lg text-xs font-semibold bg-[#0D2C54] text-white border border-[#0D2C54]" data-category="all">Tất cả</button>
      <button type="button" class="news-tab-btn shrink-0 min-h-[44px] px-4 rounded-lg text-xs font-semibold bg-white text-slate-700 border border-slate-200 hover:border-[#0D2C54]" data-category="kinh-nghiem">Kinh nghiệm chọn thảm</button>
      <button type="button" class="news-tab-btn shrink-0 min-h-[44px] px-4 rounded-lg text-xs font-semibold bg-white text-slate-700 border border-slate-200 hover:border-[#0D2C54]" data-category="xu-huong">Xu hướng</button>
      <button type="button" class="news-tab-btn shrink-0 min-h-[44px] px-4 rounded-lg text-xs font-semibold bg-white text-slate-700 border border-slate-200 hover:border-[#0D2C54]" data-category="su-kien">Sự kiện</button>
    </div>

    <!-- Featured Post -->
    <a href="/tin-tuc/bi-quyet-chon-tham-lot-san-o-to-phu-hop-cho-mua-mua-gio-bao-bung.html" class="card-surface overflow-hidden grid grid-cols-1 md:grid-cols-2 group no-underline hover:border-[#0D2C54] transition">
      <div class="aspect-[16/10] md:aspect-auto bg-slate-100 overflow-hidden">
        <img src="./assets/images/news-featured.webp" alt="Bí quyết chọn thảm lót sàn ô tô" width="640" height="400" loading="eager" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
      </div>
      <div class="p-5 sm:p-6 flex flex-col justify-center space-y-2.5">
        <span class="text-[11px] font-bold text-[#C81E2B] uppercase tracking-wide">KINH NGHIỆM · 15/06/2026</span>
        <h2 class="text-lg sm:text-xl font-bold text-[#0D2C54] m-0 leading-snug group-hover:text-[#C81E2B] transition">
          Bí quyết chọn thảm lót sàn ô tô phù hợp cho mùa mưa gió bão bùng
        </h2>
        <p class="text-xs sm:text-sm text-slate-600 m-0 leading-relaxed line-clamp-3">
          Khám phá các dòng thảm đúc khuôn nhựa TPE nguyên sinh hoặc thảm rối da 6D chống thấm, dễ xịt rửa vệ sinh tốt nhất cho chiếc xe của bạn.
        </p>
      </div>
    </a>

    <!-- Articles Grid -->
    <div id="news-grid-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </main>

  <include src="partials/footer.html"></include>
  <include src="partials/cart-drawer.html"></include>
  <include src="partials/mobile-nav.html"></include>

  <script type="module" src="./assets/js/main.js"></script>
  <script type="module">
    const articlesData = [
      { id: 2, title: "Tại sao thảm lót sàn nhựa TPE lại trở thành xu hướng năm 2026?", category: "xu-huong", date: "10/06/2026", desc: "Lý giải sức hút từ vật liệu nhựa TPE nguyên sinh đúc khuôn tràn viền: bền bỉ, không mùi, chống nước tuyệt đối.", categoryLabel: "XU HƯỚNG", image: "./assets/images/news-featured.webp" },
      { id: 3, title: "Sự khác biệt vượt trội giữa thảm da carbon và thảm da 6D truyền thống", category: "kinh-nghiem", date: "08/06/2026", desc: "So sánh chi tiết về tính thẩm mỹ, độ bền chỉ may và khả năng chống bám bụi của hai dòng thảm da bán chạy nhất.", categoryLabel: "KINH NGHIỆM", image: "./assets/images/news-featured.webp" },
      { id: 4, title: "Trung Thành Auto khai trương showroom trưng bày và dịch vụ lắp đặt mới tại Quận 7", category: "su-kien", date: "01/06/2026", desc: "Không gian showroom mới rộng rãi với đầy đủ bộ phom mẫu thảm thực tế giúp khách hàng trải nghiệm trực quan.", categoryLabel: "SỰ KIỆN", image: "./assets/images/about-workshop.webp" },
      { id: 5, title: "Hướng dẫn tự vệ sinh thảm da 5D tại nhà cực nhanh trong 10 phút", category: "kinh-nghiem", date: "24/05/2026", desc: "Mẹo sử dụng khăn ẩm vi sợi và dung dịch vệ sinh chuyên dụng giúp làm sạch nhanh bụi đất mà không làm nổ da.", categoryLabel: "KINH NGHIỆM", image: "./assets/images/news-featured.webp" },
      { id: 6, title: "Đánh giá của các chuyên gia ô tô về chất lượng thảm đúc khuôn TPE Trung Thành Auto", category: "xu-huong", date: "15/05/2026", desc: "Đánh giá cao độ ôm khít chân phanh, mép thành thảm dựng đứng giữ nước, bảo vệ sàn nỉ nguyên bản.", categoryLabel: "XU HƯỚNG", image: "./assets/images/news-featured.webp" },
      { id: 7, title: "Cách bảo quản thảm lót sàn da luôn bền đẹp sáng bóng như ngày đầu", category: "kinh-nghiem", date: "05/05/2026", desc: "Tránh phơi thảm trực tiếp dưới nắng gắt và hạn chế ngâm nước toàn bộ đối với thảm da có lớp đệm mút.", categoryLabel: "KINH NGHIỆM", image: "./assets/images/news-featured.webp" }
    ];

    const toSlug = (str) => str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[đĐ]/g, 'd').replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-').replace(/-+/g, '-');
    articlesData.forEach((a) => { a.slug = toSlug(a.title); });

    document.addEventListener('DOMContentLoaded', () => {
      const newsGrid = document.getElementById('news-grid-container');
      const tabs = document.querySelectorAll('.news-tab-btn');
      const searchInput = document.getElementById('news-search');

      let currentCategory = 'all';
      let searchQuery = '';

      const renderArticles = () => {
        let filtered = [...articlesData];
        if (currentCategory !== 'all') filtered = filtered.filter((a) => a.category === currentCategory);
        if (searchQuery) filtered = filtered.filter((a) => a.title.toLowerCase().includes(searchQuery) || a.desc.toLowerCase().includes(searchQuery));

        if (filtered.length === 0) {
          newsGrid.innerHTML = `<div class="col-span-full card-surface p-8 text-center text-xs text-slate-500">Không tìm thấy bài viết phù hợp.</div>`;
          return;
        }

        newsGrid.innerHTML = filtered.map((a) => `
          <a href="/tin-tuc/${a.slug}.html" class="card-surface overflow-hidden flex flex-col group no-underline hover:border-[#0D2C54] transition">
            <div class="aspect-[16/10] bg-slate-100 overflow-hidden">
              <img src="${a.image}" alt="${a.title}" width="400" height="250" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
            </div>
            <div class="p-4 flex-1 flex flex-col justify-between gap-3">
              <div class="space-y-1.5">
                <span class="text-[11px] font-semibold text-[#C81E2B] uppercase">${a.categoryLabel} · ${a.date}</span>
                <h3 class="font-semibold text-slate-900 text-sm m-0 leading-snug group-hover:text-[#0D2C54] line-clamp-2">${a.title}</h3>
                <p class="text-xs text-slate-600 m-0 leading-relaxed line-clamp-2">${a.desc}</p>
              </div>
              <span class="text-xs font-semibold text-[#0D2C54]">Đọc tiếp &rarr;</span>
            </div>
          </a>
        `).join('');
      };

      tabs.forEach((tab) => {
        tab.addEventListener('click', () => {
          tabs.forEach((t) => {
            t.classList.remove('bg-[#0D2C54]', 'text-white', 'border-[#0D2C54]');
            t.classList.add('bg-white', 'text-slate-700', 'border-slate-200');
          });
          tab.classList.add('bg-[#0D2C54]', 'text-white', 'border-[#0D2C54]');
          tab.classList.remove('bg-white', 'text-slate-700', 'border-slate-200');
          currentCategory = tab.dataset.category;
          renderArticles();
        });
      });

      searchInput.addEventListener('input', () => {
        searchQuery = searchInput.value.toLowerCase().trim();
        renderArticles();
      });

      renderArticles();
    });
  </script>
</body>
</html>
